services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dl024_backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - ./ml/models:/app/ml/models

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dl024_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
